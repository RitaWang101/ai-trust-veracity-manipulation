[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trust-veracity-manipulation"
version = "0.1.0"
description = "Reproducible evaluation prototype for AI Trust Lab Veracity and Manipulation pillars"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-trust-eval = "ai_trust_eval.cli:main"

[tool.setuptools]
packages = ["ai_trust_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
